<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'"
    />
    <title>Starting scope</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f7f5f0;
        color: #211f1b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #151512;
          color: #f2eee6;
        }
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 18px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      p {
        margin: 0;
        font-size: 14px;
        opacity: 0.68;
      }
      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 999px;
        opacity: 0.6;
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
          border-right-color: currentColor;
        }
      }
    </style>
