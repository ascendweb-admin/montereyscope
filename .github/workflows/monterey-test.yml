name: Monterey Intel test DMG

# Run only on request, on the standard Intel runner in this public build repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out Monterey source
        uses: actions/checkout@v4

      - name: Build unsigned Intel Monterey test DMG
        run: bash BUILD-MONTEREY.command

      - name: Test existing provider authentication
        run: >-
          node node_modules/vitest/vitest.mjs run
          tests/unit/ai-claude-auth.test.ts
          tests/unit/ai-auth-manager-lifecycle.test.ts
          tests/unit/ai-auth-routes.test.ts
          tests/integration/ai-claude-process.test.ts
          tests/component/ai-backend-setting.test.tsx

      - name: Type-check the built application
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Verify Monterey native dependency requirements
        run: node desktop/scripts/check-monterey-native.cjs

      - name: Verify the actual packaged backend
        run: node desktop/scripts/check-monterey-backend.cjs desktop/dist/mac/scope.app

      - name: Verify DMG integrity and record checksum
        working-directory: desktop/dist
        run: |
          hdiutil verify scope-0.1.9-macos-x64-monterey-main-16bdd44.dmg
          shasum -a 256 scope-0.1.9-macos-x64-monterey-main-16bdd44.dmg > scope-0.1.9-macos-x64-monterey-main-16bdd44.dmg.sha256

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: scope-monterey-intel-main-16bdd44
          path: desktop/dist/scope-0.1.9-macos-x64-monterey-main-16bdd44.dmg*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
